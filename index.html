<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xKogami | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 20px;
        }
        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover {
            background-color: #2ea44f;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="avatar" src="https://github.com" alt="0xKogami Avatar">
        <h1>0xKogami</h1>
        <p>Selamat datang di website resmi saya. Ini adalah halaman statis yang di-hosting menggunakan GitHub Pages.</p>
        <a href="https://github.com" class="btn" target="_blank">Kunjungi GitHub Saya</a>
    </div>

</body>
</html>
